<body class="world" data-mode="standard">

<header class="w-top">
  <a class="w-brand wglass" href="/" aria-label="Baryon home">
    <svg width="24" height="22" viewBox="0 0 100 92" fill="none" aria-hidden="true">
      <path d="M9 8 L91 8 L54 82 Q50 89 46 82 Z" stroke="#141414" stroke-width="8" stroke-linejoin="round" fill="none"/>
      <text x="50" y="47" text-anchor="middle" dominant-baseline="middle" fill="#141414" font-family="Arial, sans-serif" font-weight="800" font-size="42">B</text>
    </svg>
  </a>
  <div class="omni">
    <form class="omnibox wglass" id="omnibox" role="search" autocomplete="off">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search places, sites and layers, or ask…" aria-label="Search places, resource sites and datasets, or ask a question" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-controls="omni-results" aria-expanded="false">
      <button class="omni-clear" id="omni-clear" type="button" aria-label="Clear search" hidden>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <button class="omni-lucky" id="lucky" type="button" title="I'm feeling lucky: fly somewhere remarkable" aria-label="I'm feeling lucky" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="9" cy="15" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="omni-ask" id="ask" type="button" title="Ask the World Model agent" aria-label="Ask the agent">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9zM19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>
        <span class="ask-label">Ask</span>
      </button>
    </form>
    <div id="omni-results" class="omni-results wglass" role="listbox" aria-label="Search suggestions" hidden></div>
    <div id="omni-status" class="w-sr" role="status" aria-live="polite"></div>
  </div>
</header>

<nav id="rail" class="rail wglass" aria-label="World Model panels"></nav>

<main aria-label="World Model">
<div id="map" role="application" aria-label="3D globe. Drag to rotate, scroll to zoom, right-drag or Ctrl-drag to tilt."></div>
<div id="fx" class="fx" aria-hidden="true"></div>
<div id="modebar" class="modebar wglass" role="group" aria-label="Visual mode"></div>
<div id="controls" class="w-controls" role="toolbar" aria-label="Map controls"></div>
</main>

<aside id="dock" class="dock wglass" aria-labelledby="dock-title" hidden>
  <div class="dock-head">
    <h2 id="dock-title">Explore</h2>
    <button class="icon-btn" id="dock-close" type="button" aria-label="Close panel">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="dock-body" id="dock-body"></div>
</aside>

<section id="card" class="card-float wglass" role="region" aria-labelledby="card-title" hidden>
  <button class="icon-btn card-close" id="card-close" type="button" aria-label="Close place card">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="card-body" id="card-body"></div>
</section>
<div id="card-status" class="w-sr" role="status" aria-live="polite"></div>

<div id="timebar" class="timebar wglass" role="region" aria-label="Imagery date" hidden>
  <div><div class="lbl" id="time-label">—</div><div class="sub" id="time-sub">Imagery date</div></div>
  <input id="time-range" type="range" min="0" max="100" value="100" aria-label="Imagery date">
  <button class="icon-btn" id="time-close" type="button" aria-label="Hide time slider">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</div>

<footer class="statusbar" id="status">
  <div class="status-pill wglass" id="status-coords" aria-live="off">—</div>
  <div class="status-pill wglass attr-pill" id="status-attr"></div>
</footer>

<div id="toasts" class="toasts"></div>

<script type="module" src="/world/js/main.js?v=20260929"></script>
